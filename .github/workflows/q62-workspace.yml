name: Q6.2 离线测试工作区
on:
  push:
    branches: [research/q6-real-continuity-pilot]
    paths: [.github/workflows/q62-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 导出已提交源码用于隔离测试（不读本机配置）
        run: |
          mkdir -p run/q62-workspace
          git bundle create run/q62-workspace/source.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: q62-test-workspace
          path: run/q62-workspace/source.bundle
          retention-days: 1
